name: 构建 MoonTV Windows 客户端

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 安装依赖
        run: |
          rustc --version
          cargo --version

      - name: 缓存 Tauri CLI
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri*
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-cli-${{ runner.os }}-2

      - name: 安装 Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2"
          else
            echo "Tauri CLI 已缓存，跳过编译"
          fi

      - name: 构建 MoonTV 客户端
        run: cargo tauri build

      - name: 打包 zip（exe + 配置文件 + 说明）
        shell: bash
        run: |
          mkdir -p release/MoonTV
          cp src-tauri/target/release/*.exe release/MoonTV/
          cp settings.ini release/MoonTV/
          # 使用 PowerShell 压缩为 zip
          powershell -Command "Compress-Archive -Path 'release/MoonTV/*' -DestinationPath 'release/MoonTV-Windows-x64.zip' -Force"
          ls -la release/

      - name: 创建 Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ github.run_number }}
          name: "MoonTV v${{ github.run_number }}"
          body: |
            MoonTV 轻量 Windows 客户端自动构建
            
            - 构建时间: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            - 提交: ${{ github.sha }}
            
            使用方法：
            1. 下载 MoonTV-Windows-x64.zip
            2. 解压到任意目录
            3. 运行 MoonTV.exe
            4. 如需修改域名/代理，编辑 settings.ini 后重启
          artifacts: |
            release/MoonTV-Windows-x64.zip
          artifactContentType: application/zip
          draft: false
          prerelease: false