# MoonTV 客户端配置文件
# 放在 exe 同级目录下，程序启动时自动读取
# 如不需要修改，可以不创建此文件，使用内置默认值

# ========== 域名 ==========
#
# 注意：目标域名默认值在 GitHub 仓库源码中修改！
# 位置：src-tauri/src/lib.rs 里的 get_default_url()
# 修改后推送，GitHub Actions 会自动重新构建。
# 此配置文件不用于修改域名。

# ========== 代理设置 ==========

# 代理模式：system / direct / custom
#   system  - 跟随 Windows 系统代理（默认）
#   direct  - 直连，不走任何代理
#   custom  - 使用自定义代理
# 默认值：system
proxy_mode = system

# 自定义代理地址（仅 proxy_mode = custom 时生效）
# custom_proxy = 127.0.0.1:10809

# ========== WebView2 优化 ==========

# 禁用 GPU 加速（省内存，适合平板）
# 设为 false 可启用 GPU 硬件加速（看视频卡顿可以试试）
# 默认值：true
disable_gpu = true

# JS 堆内存上限（MB），限制浏览器 JS 内存使用
# 设为 0 或留空表示不限制
# 默认值：128
max_js_heap = 128